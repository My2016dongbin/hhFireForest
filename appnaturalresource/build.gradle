apply plugin: 'com.android.application'
def VERSION_CODE = 5
def VERSION_NAME = "1.1.4"
def keystoreFilepath = ''
def keyfile = file('s.keystore.temp')

android {
    compileSdkVersion rootProject.compileSdkVersion
    buildToolsVersion rootProject.buildToolsVersion

    defaultConfig {
        applicationId "com.haohai.resource.appnaturalresource"
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        versionCode VERSION_CODE
        versionName VERSION_NAME
        multiDexEnabled true
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [moduleName: project.getName()]
            }
        }

        ndk {
            //设置支持的SO库架构
            abiFilters "armeabi-v7a", "x86","arm64-v8a","x86_64"
        }
        /*jackOptions {//升级
            enabled true
        }*/
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    /*dexOptions {//升级
        incremental true
        javaMaxHeapSize "4g"
    }*/

    compileOptions{
        sourceCompatibility rootProject.ext.appSourceCompatibility
        targetCompatibility rootProject.ext.appTargetCompatibility
    }

    /*dataBinding {//升级
        enabled = true
    }*/

    packagingOptions {
        exclude 'META-INF/rxjava.properties'
    }


    /*aaptOptions {//升级
        cruncherEnabled = false
        useNewCruncher = false
    }*/
}

dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])
    androidTestApi('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    api project(':platformmodel')
}
