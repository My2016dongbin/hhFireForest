<!DOCTYPE html>
<html lang="zh-cn">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <!-- 移动设备 viewport -->
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,minimal-ui">
  <!-- 360浏览器默认使用Webkit内核 -->
  <meta name="renderer" content="webkit">
  <title></title>
  <link href="static/css/geoFont/iconfont.css" rel="stylesheet">
  <link href="./css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/pretty.css" rel="stylesheet">
  <script type="text/javascript" src="jquery/jquery-2.1.4.min.js"></script>
  <script src="./js/bootstrap.min.js"></script>
  <script src="./js/bootstrap-select.min.js"></script>
  <script src="./js/config.js"></script>
  <!--    Cesium+vue-->
  <link href="static/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="static/Cesium/Cesium.js"></script>
  <!--    supermap-->
  <script src="static/js/config.js"></script>
  <script src="static/js/tooltip.js"></script>
  <!-- 第3方lib -->
  <script type="text/javascript" src="static/Cesium/ThirdParty/Workers/PlotAlgo/PlotAlgoInclude.js"></script>
  <script src="dsbridge.js"></script>
  <style>
        .cesium-viewer-bottom {
            display: none;
        }
        .cesium-viewer-zoomIndicatorContainer{
            display: none;
        }
        #parkdetail{
          width: 450px;
          height: 150px;
          background: #292827;
          position: absolute;
          top: 50px;
          right: 0px;
          color: white;
          display: none;
        }
  </style>
</head>

<body>
<noscript>
  <strong>We're sorry but app doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
</noscript>
<div id="bmapContainer" style="display:none"></div>
<div id="cesiumContainer" ></div>
<div class="scene-mode-item"  @click="modeChange('2d')">2D</div>
<div class="scene-mode-item"  @click="modeChange('3d')">3D</div>
<div style="background-image: url(img/home.png);display: block;position: absolute;top: 0;right: 13px;width: 32px;height: 33px;"  onclick="gohome();"></div>
<div id="parkdetail">
  <img id="parkimg"
  width="40%"
  style="float:left; margin: 10px;height: 88%"
  src="./ic_park.png"/>
  <p id="parkname" style="margin: 10px">
    青岛浮山
  </p>
  <button id="pclose" style="float: right;margin-top: -33px;color: white;background-color: black;border: black;">X</button>
  <p id="parkqu">
    区： 崂山区
  </p>
  <p id="parkarea">
    面积： 120公顷
  </p>
  <div>
  <p id="parkadd" style="text-align: start">
    地址： 浮山&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
  </p>
    <button style="float: right;margin-top: -33px;z-index: 10" onclick="godetail()">详情</button>
    </div>
</div>
<script src="CesiumPopup.js"></script>
<script src="mars_demo2.js"></script>


</body>
</html>
