apply plugin: 'com.android.library'
def VERSION_CODE = 1
def VERSION_NAME = "1.0"
android {
    compileSdkVersion rootProject.compileSdkVersion
    buildToolsVersion rootProject.buildToolsVersion
    aaptOptions.cruncherEnabled = false
    aaptOptions.useNewCruncher = false
    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        versionCode VERSION_CODE
        versionName VERSION_NAME
        multiDexEnabled true
        buildConfigField('String', 'VERSION_NAME', "\""+VERSION_NAME+"\"")

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])
    api files('libs/ijkplayer-java-release.aar')
    androidTestApi('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    // compile 'tv.danmaku.ijk.media:ijkplayer-armv7a:0.8.8'

    api 'com.android.support:appcompat-v7:26.0.1'
//    api 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    api 'com.github.bumptech.glide:glide:3.7.0'
    api 'com.android.support.constraint:constraint-layout:1.0.2'
    api("com.qiniu:qplayer2-core:1.1.4")
    //api("com.qiniu:qplayer2-ext:1.1.2") //如果无需qplayer2-ext能力可以不引入 不影响core的使用
    testApi 'junit:junit:4.12'
}
