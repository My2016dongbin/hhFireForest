apply plugin: 'com.android.application'

def VERSION_CODE = 204
def VERSION_NAME = "2.0.4"

def keystoreFilepath = ''
def keyfile = file('s.keystore.temp')

// 依赖插件脚本
apply from: 'tinker-support.gradle'

android {
    compileSdkVersion rootProject.compileSdkVersion
    buildToolsVersion rootProject.buildToolsVersion
    defaultConfig {
        applicationId "com.haohai.platform.fireforestplatform"
        minSdkVersion rootProject.minSdkVersion
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        targetSdkVersion rootProject.targetSdkVersion
        versionCode VERSION_CODE
        versionName VERSION_NAME
        multiDexEnabled true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [moduleName: project.getName()]
            }
        }

        ndk {
            //设置支持的SO库架构
            /*abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64","armeabi"*/
            /*abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a'*/
            abiFilters 'armeabi', 'armeabi-v7a'
//            abiFilters 'arm64-v8a'
        }
        manifestPlaceholders = [
                XG_ACCESS_ID : "1500015815",
                XG_ACCESS_KEY : "AO3YNOCJ0AK2",
                HW_APPID: "103450845"
        ]
        /*jackOptions {
            enabled true
        }*/
    }

    signingConfigs {
        config {
            keyAlias 'haohai'
            keyPassword 'haohaiadmin'
            storeFile file('../app/sign.jks')
            //storeFile file('C:/workspaces/haohai/FireForestPlatform/app/sign.jks')
            storePassword 'haohaiadmin'
        }
    }



    buildTypes {
        debug {
            println("====== buildTypes.debug ======")
            signingConfig signingConfigs.debug
        }

        release {
            //是否混淆
            minifyEnabled false
            //是否移除无用资源
            zipAlignEnabled false
            multiDexKeepFile file ('multidex-config.txt')// 小括号记得要加上，官方文档没有 bugly
            //混淆配置
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            //签名文件存在，则签名
            if (keyfile.exists()) {
                println("WITH -> buildTypes -> release: using jks key")
                signingConfig signingConfigs.config
            } else {
                println("WITH -> buildTypes -> release: using default key")
            }
            android.applicationVariants.all {
                variant ->
                    variant.outputs.all {
                        //在这里修改apk文件名
                        outputFileName = "haohai-${variant.versionName}.apk"
                    }
            }
            signingConfig signingConfigs.config
        }
    }
    lintOptions {
        abortOnError false
        disable "Instantiatable"
    }


    flavorDimensions "app"
    productFlavors {
        /*  xiaomi {
              manifestPlaceholders = [UMENG_CHANNEL_VALUE: "xiaomi"]
          }*/
        /*  kuan {
            manifestPlaceholders = [UMENG_CHANNEL_VALUE: "kuan"]
        }*/
        xiaomi {
            manifestPlaceholders = [
                    UMENG_CHANNEL_VALUE: "xiaomi",
            ]
        }
        /*   qh360 {
            manifestPlaceholders = [UMENG_CHANNEL_VALUE: "qh360"]
        }
        baidu {
            manifestPlaceholders = [UMENG_CHANNEL_VALUE: "baidu"]
        }
        wandoujia {
            manifestPlaceholders = [UMENG_CHANNEL_VALUE: "wandoujia"]
        }
        oppo {
            manifestPlaceholders = [UMENG_CHANNEL_VALUE: "oppo"]
        }
        vivo {
            manifestPlaceholders = [UMENG_CHANNEL_VALUE: "vivo"]
        }*/
        oppo {
            manifestPlaceholders = [UMENG_CHANNEL_VALUE: "oppo"]
        }
        huawei {
            manifestPlaceholders = [
                    UMENG_CHANNEL_VALUE: "huawei",

            ]

        }
        /*
        yingyongbao {
            manifestPlaceholders = [UMENG_CHANNEL_VALUE: "yingyongbao"]
        }
        anzhi {
            manifestPlaceholders = [UMENG_CHANNEL_VALUE: "anzhi"]
        }*/
    }

    packagingOptions {
        exclude 'META-INF/rxjava.properties'
    }
   dexOptions {
       javaMaxHeapSize "6g"
       dexInProcess true
       preDexLibraries true
       incremental true
    }
    aaptOptions {
        cruncherEnabled = false
        useNewCruncher = false
    }

    compileOptions {
        sourceCompatibility org.gradle.api.JavaVersion.VERSION_1_8
        targetCompatibility org.gradle.api.JavaVersion.VERSION_1_8
    }

    dataBinding {
        enabled = true
    }

    sourceSets{
        main{
            jniLibs.srcDir 'libs'
            jni.srcDirs = []    //disable automatic ndk-build
        }
    }

}


dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    androidTestCompile('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    api project(':platformmodel')
    //路由在 主模块 跟 model中要分别引包
    api project(':firemodel')
    api project(':mapmodel')
    api 'com.alibaba:arouter-api:1.3.1'
    /*    compile 'com.tencent.jg:jg:1.1'
        compile 'com.tencent.tpns:tpns:1.2.1.3-release'*/
    testImplementation 'junit:junit:4.12'
    annotationProcessor 'com.alibaba:arouter-compiler:1.1.4'
    api 'com.xdandroid:hellodaemon:+'
//    api 'com.android.support:support-v4:26.0.0-alpha1'


    api "com.android.support:multidex:1.0.3" // 多dex配置
    api 'com.tencent.bugly:nativecrashreport:3.9.0'
    api 'com.tencent.tinker:tinker-android-lib:1.9.14.17'
    api 'com.tencent.bugly:crashreport_upgrade:1.5.23'
}
