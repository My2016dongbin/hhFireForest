apply plugin: 'com.android.application'

def keyfile = file('s.keystore.temp')
android {
    compileSdkVersion 20
    buildToolsVersion "20.0.0"

    defaultConfig {
        applicationId "com.river.szdapp"
        minSdkVersion 14
        targetSdkVersion 20

        versionCode 1
        versionName "1.0.1"

        ndk { abiFilters "armeabi", "armeabi-v7a", "mips", "x86"}
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    signingConfigs {
        config {
            keyAlias 'haohai'
            keyPassword 'haohaiadmin'
            storeFile file('../app/sign.jks')
            storePassword 'haohaiadmin'
        }
    }

    lintOptions {
        aaptOptions.cruncherEnabled = false
        aaptOptions.useNewCruncher = false
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        debug {
            println("====== buildTypes.debug ======")
            signingConfig signingConfigs.debug
        }

        release {
            //是否混淆
            minifyEnabled false
            //是否移除无用资源
            zipAlignEnabled false
            multiDexKeepFile file ('multidex-config.txt')// 小括号记得要加上，官方文档没有 bugly
            //混淆配置
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            /*ndk{
                //QQ微信等大佬都只用"armeabi"
                abiFilters "armeabi-v7a"
            }*/
            //签名文件存在，则签名
            if (keyfile.exists()) {
                println("WITH -> buildTypes -> release: using jks key")
                signingConfig signingConfigs.config
            } else {
                println("WITH -> buildTypes -> release: using default key")
            }
            android.applicationVariants.all {
                variant ->
                    variant.outputs.all {
                        //在这里修改apk文件名
                        outputFileName = "szd-${variant.versionName}.apk"
                    }
            }
            signingConfig signingConfigs.config
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    flavorDimensions "app"
    productFlavors {
        xiaomi {
            manifestPlaceholders = [
                    UMENG_CHANNEL_VALUE: "xiaomi",
            ]
        }
        huawei {
            manifestPlaceholders = [
                    UMENG_CHANNEL_VALUE: "huawei",

            ]

        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }
}

dependencies {
    compile 'com.android.support:support-v4:20.0.0'
    compile 'com.google.code.gson:gson:2.2.1'
    compile files('libs/commons-codec-1.6.jar')
    compile files('libs/commons-lang.jar')
    compile files('libs/commons-logging-1.1.3.jar')
    compile files('libs/fastjson-1.2.34.jar')
    compile files('libs/fluent-hc-4.4-beta1.jar')
    compile files('libs/httpclient-4.4-beta1.jar')
    compile files('libs/httpclient-cache-4.4-beta1.jar')
    compile files('libs/httpclient-win-4.4-beta1.jar')
    compile files('libs/httpcore-4.4-beta1.jar')
    compile files('libs/httpmime-4.4-beta1.jar')
    compile files('libs/jna-4.1.0.jar')
    compile files('libs/jna-platform-4.1.0.jar')
    compile files('libs/json-lib-2.4-jdk15.jar')
    compile files('libs/json.jar')
    compile files('libs/ksoap2-android-assembly-3.0.0-jar-with-dependencies.jar')
    compile files('libs/locSDK_4.0.jar')
    compile files('libs/tbs_sdk_thirdapp_v3.6.0.1310_43612_sharewithdownload_withoutGame_obfs_20180706_163319.jar')
    compile files('libs/zbardecoder.jar')
}
