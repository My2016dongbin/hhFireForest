// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        /*maven{ url'http://maven.aliyun.com/nexus/content/groups/public/'}
        jcenter()
        maven { url 'https://jitpack.io' }
        maven {
            url "https://repo.eclipse.org/content/repositories/paho-releases/"
        }
        google()*/
        maven { url 'https://jitpack.io' }
        maven {
            url "https://repo.eclipse.org/content/repositories/paho-releases/"
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'http://maven.aliyun.com/nexus/content/groups/public' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/jcenter' }
        jcenter() { url 'https://jcenter.bintray.com/' }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:4.2.1"
        classpath 'com.tencent.android.tpns:tpnsplugin:1.2.0'
        classpath 'me.tatarka:gradle-retrolambda:3.2.5'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files

        // tinkersupport插件, 其中lastest.release指拉取最新版本，也可以指定明确版本号，例如1.0.4
//        classpath "com.tencent.bugly:tinker-support:1.1.5"

        classpath "com.tencent.bugly:tinker-support:1.2.3"
    }
}

allprojects {
    repositories {
        /*maven{ url'http://maven.aliyun.com/nexus/content/groups/public/'}
        jcenter()
        maven { url 'https://jitpack.io' }
        google()*/
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'http://maven.aliyun.com/nexus/content/groups/public' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/jcenter' }
        jcenter() { url 'https://jcenter.bintray.com/' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}




ext{

    needPrivateDebug = true

    compileSdkVersion = 26
    minSdkVersion = 23

    targetSdkVersion = 26
    buildToolsVersion = '26.0.3'

    sdkSourceCompatibility = 1.8
    sdkTargetCompatibility = 1.8
    appSourceCompatibility = 1.8
    appTargetCompatibility = 1.8

    system_dependencies = [
            support_v4       : 'com.android.support:support-v4:26.1.0',
            appcompat_v7    : 'com.android.support:appcompat-v7:26.1.0',
            cardview_v7      : 'com.android.support:cardview-v7:26.1.0',
            palette_v7       : 'com.android.support:palette-v7:26.1.0',
            recyclerview_v7 : 'com.android.support:recyclerview-v7:26.1.0',
            design           : 'com.android.support:design:25.0.1',
            rxjava           : 'io.reactivex.rxjava2:rxjava:2.0.5',
            rxandroid        : 'io.reactivex:rxandroid:1.2.0',
            rxbinding        : 'com.jakewharton.rxbinding:rxbinding:0.4.0',
            glide            : 'com.github.bumptech.glide:glide:3.7.0',
            gson             : 'com.google.code.gson:gson:2.2.4',
            multitype             : 'me.drakeet.multitype:multitype:2.2.2',
            fresco        : 'com.facebook.fresco:fresco:0.8.1+',
            xutils         : 'org.xutils:xutils:3.3.36',

    ]

}
